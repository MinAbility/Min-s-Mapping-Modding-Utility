name: Build Binaries

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  release:
    types: [created]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install PySide6 pyinstaller
          if (Test-Path requirements.txt) { pip install -r requirements.txt }

      - name: Build Windows Binary
        run: pyinstaller --noconsole --name MinModdingMappingUtility window.py

      - name: Compile Inno Setup Installer
        uses: Minionguyjpro/Inno-Setup-Action@v1.2.2
        with:
          path: MinModdingMappingUtility.iss
          options: /O+

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MinModdingMappingUtility-Windows-Setup
          path: Output/MinModdingMappingUtility-Setup.exe

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install PySide6 pyinstaller
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Build Linux Binary
        run: pyinstaller --onefile --windowed --name MinModdingMappingUtility window.py

      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MinModdingMappingUtility-Linux
          path: dist/MinModdingMappingUtility
